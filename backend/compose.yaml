services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - academico_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico -d academico"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  academico_data:
