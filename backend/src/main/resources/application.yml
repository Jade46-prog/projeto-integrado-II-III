spring:
  application:
    name: academico-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academico}
    username: ${DB_USER:academico}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  admin-cpf: ${ADMIN_CPF:99999999999}
  admin-password: ${ADMIN_PASSWORD:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  semester-start: ${SEMESTER_START:2026-08-03}
  semester-end: ${SEMESTER_END:2026-12-18}
